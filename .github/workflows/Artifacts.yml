name: Artifacts example 

on: 
  push :
    branches: 
      - main
    paths: 
      - reactBoilerplate/**
      - ".github/workflows/Artifacts.yml"  

jobs: 
  build:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: reactBoilerplate

    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 22

      - run : npm install

      - run : npm run build

      - uses : actions/upload-artifact@v4 
        with: 
          name: build-files
          path: dist

  test :
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: reactBoilerplate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 22

      - run : npm install

      - run : npm test   

  deploy:
    needs: build
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: reactBoilerplate

    steps: 
      - uses: actions/download-artifact@v4
        with: 
          name: build-files
          path: dist
      - run : echo "deploying to production ...."


