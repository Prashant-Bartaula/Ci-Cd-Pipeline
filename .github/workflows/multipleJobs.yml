name : Multiple jobs example 

on: 
  push: 
    branches:
      - "main"
    paths:
      - "reactBoilerplate/**"  
      - ".github/workflows/multipleJobs.yml"

jobs: 
  lint: 
    runs-on: "ubuntu-latest"

    defaults:
      run:
        working-directory: reactBoilerplate

    steps: 
      - uses : actions/checkout@v4 

      - uses: actions/setup-node@v4
        with: 
          node-version: 22   

      - run : npm install 

      - run : npm run lint


  test: 
    runs-on: "ubuntu-latest"

    defaults:
      run:
        working-directory: reactBoilerplate

    steps:
      - uses : actions/checkout@v4 

      - uses: actions/setup-node@v4
        with: 
          node-version: 22   

      - run : npm install 

      - run : npm  test


  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: reactBoilerplate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - run: echo "Deploying application..."    

