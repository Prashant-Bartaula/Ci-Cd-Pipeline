name: CICD pipeline example (MultiEvent)

on: 
  push:
    branches: ["main"]
    paths: 
     - "basicCICD/**"
     - ".github/workflows/multiEvent.yml"
  pull_request:
    branches: ["main"]
    paths: 
      - "basicCICD/**"
      - ".github/workflows/multiEvent.yml"

jobs:
  test:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: basicCICD

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version: 22

      - run: npm install